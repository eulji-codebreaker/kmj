<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        /* #username {
            width: 10px;
            height: 10px;
        } */
    </style>
</head>
<body>
    <h1>사용자 입력 양식 이벤트 연습하기</h1>

    <form name="memberjoin">
        
        <label for="username"><b>이름</b></label><br>
        <input type="text" name="username" id="username" placeholder="이름을 입력하세요"><br>

        <label for="email"><b>이메일</b></label><br>
        <input type="text" name="email" id="email" placeholder="example@domain.com">

        <br><br>

        <label>성별</label>
        <input type="radio" name="gender" id="male" value="m" checked><label for="male">남자</label>
        <input type="radio" name="gender" id="female" value="f"><label for="female">여자</label>

        <br><br>

        <label>나이</label>
        <select id="age" name="age">
            <option value="10">10대 이하</option>
            <option value="20">20대</option>
            <option value="30">30대</option>
            <option value="40">40대</option>
            <option value="50">50대</option>
            <option value="60">60대 이상</option>
        </select>

        <br><br>

        <label>자기소개</label>
        <textarea name="introduce" id="introduce" rows="5" cols="30" style="resize: none;">저를 소개합니다!</textarea>
        <!--resize: none: 크기 조절 불가-->
        <span>0</span>/5000자

        <br><br>

        <input type="submit" value="제출">
    </form>
</body>
</html>

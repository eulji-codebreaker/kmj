<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        * {
            box-sizing: border-box;
        }
/* div {
            border: 0.5px solid gray;
        } */
        body {
            margin: 0;
        }

        

        @media(min-width : 780px) {
            .container {
                justify-content: center;
                display: grid;
                grid-template-columns: 200px 1fr 200px;
                gap: 10px;
                padding: 1px;
            }
        }

        header {
            background-color: rgb(48, 48, 53);
            color: white;
            padding: 15px;
            text-align: left;
        }

        nav {
            background-color: aliceblue;
            border: 0.1px solid gray;
            margin: 5px;
            padding: 10px;
        }

        #default-bullet {
            text-align: left;
            margin-left: -20px;
            margin-top: 0px;
        }

        main {
            border: 0.1px solid gray;
            padding: 15px;
            margin: 5px;
        }

        aside {
            margin: 5px;
            border: 0.1px solid gray;
            padding: 10px;
        }

        article {
            font-size: 30px;
            font-weight: bold;
        }

        figure {
            background: skyblue;
            border: 2px dashed;
            margin: 15px;
            padding: 10px;
        }

        footer {
            background-color: rgb(48, 48, 53);
            color: white;
            padding: 15px;
            text-align: left;
        }
    </style>
</head>

<body>
    <header>
        <p>머리부(Header)</p>
    </header>

    <div class="container">
        <nav>
            <label><b>네비게이션(Nav)</b></label>
            <ul id="default-bullet">
                <li>Home</li>
                <li>About</li>
                <li>Contact</li>
            </ul>
        </nav>

        <main>
            <article>
                <p>메인 콘텐츠(Main)</p>
            </article>

            <figure>
                <p>양옆은 고정폭, 가운데는 가변폭!</p>
            </figure>
            <p>Hint. 가운데 영역은 1fr로 남는 공간을 차지합니다.</p>
            <p>Grid에서는 grid-template-columns: 200px 1fr 200px로 설정했습니다.</p>
        </main>

        <aside>
            <label><b>사이드바(Aside)</b></label>
            <p>공지/광고/프로필 등</p>
        </aside>
    </div>

    <footer>
        바닥부(footer)
    </footer>
</body>

</html>

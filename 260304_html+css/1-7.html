<!DOCTYPE html>
<html lang="ko">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>1-7</title>

<style>
    * {
        box-sizing: border-box;
    }

    .container {
        width: 278px;
        height: 160px;
        border-radius: 10px;
        background: #CA785C;
        overflow: hidden;
    }

    .img {
        width: 100%;
        height: 120px;
        overflow: hidden;
    }

    .img img {
        width: 100%;
        height: 100%;
        object-fit: cover;
    }

    .f {
        height: 40px;
        display: flex;
        align-items: center;     
        justify-content: flex-start;
        padding-left: 12px;

        font-weight: 700;
        font-size: 16px;
        color: white;
    }
</style>
</head>

<body>

<div class="container">
    <div class="img">
        <img src="asset/imge/img1.jpg" alt="이미지">
    </div>

    <div class="f">
        안녕하세요!
    </div>
</div>

</body>
</html>

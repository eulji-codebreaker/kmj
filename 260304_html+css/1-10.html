<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>
        * {
            box-sizing: border-box;
        }

        .container {
            width: 320px;
            height: 80px;
            top: 16px;
            left: 16px;
            background: #CA785C;
            padding: 2px;
        }

        .info {
            text-align: center;
            justify-content: space-evenly;
            display: flex;
            flex-direction: row;
            padding: 25px;
        }

        .f1 .f2 .f3 .f4 {
            font-family: Inter;
            font-weight: 700;
            font-style: Bold;
            font-size: 24px;
            line-height: 100%;
            letter-spacing: 0%;
            color: white;
            
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="info">
            <div class="f1">봄</div>
            <div class="f2">여름</div>
            <div class="f3">가을</div>
            <div class="f4">겨울</div>
        </div>
    </div>
</body>

</html>

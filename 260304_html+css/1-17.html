<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>
        .container {
            width: 300px;
            height: 250px;
            position: relative;
        }

        img {
            width: 300px;
            height: 250px;
            border-radius: 8px;
            object-fit: cover;
        }

        .box {
            width: 300px;
            height: 56px;
            display: flex;
            border-bottom-left-radius: 8px;
            border-bottom-right-radius: 8px;
            flex-direction: column;
            justify-content: center;
            align-items: flex-start;
            object-fit: cover;
            background: rgba(0, 0, 0, 0.5);

            position: absolute;

            bottom: 0;
        }

        .font {
            padding: 5px;
            padding-left: 5px;
            font-size: 12px;
            font-weight: 700;
            color: white;
        }

        .font1 {
            padding-left: 5px;
            font-size: 12px;
            font-weight: 700;
            color: #D1D1D1;
        }
    </style>
</head>

<body>
    <div class="container">
        <img src="asset/imge/img4.jpg" alt="이미지">
        <div class="box">
            <div class="font">새로운 시작!</div>
            <div class="font1">김작가</div>
        </div>
    </div>


</body>

</html>

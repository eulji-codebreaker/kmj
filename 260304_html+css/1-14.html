<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>1-8</title>

  <style>
    * {
      box-sizing: border-box;
    }

    .container {
      width: 120px;
      height: 170px;
      border-radius: 16px;
      overflow: hidden;
      background-color: #FFB9B9;
      position: relative;
    }

    .fixed-box1 {
      width: 24px;
      height: 24px;
      border-radius: 50px;
      background: #D9D9D9;

      position: absolute;

      bottom: 10px;
      right: 10px;
    }

    p {
      font-size: 12px;
      font-weight: 400;

      display: flex;
      justify-content: center;
      align-items: left;

      transform: translateX(-37%);

      max-width: 100%;
      word-wrap: break-word;
    }
  </style>
</head>

<body>

  <div class="container">
    <div class="fixed-box1"></div>
    <div>  
      <p>나른한 점심시간, 밖에서 밥먹기</p>
</div>

</body>

</html>

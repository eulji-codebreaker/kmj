<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>
        .container {
            width: 332px;
            height: 100px;
            background: #FFE4E4;
            border-radius: 8px;
            position: relative;
            display: flex;

        }

        .box {
            width: 160px;
            height: 100px;
            background-color: #FFB9B9;
            border-radius: 8px;

        }

        .box1 {
            width: 96px;
            height: 19px;
            padding-top: 2px;
            padding-bottom: 2px;
            padding-left: 8px;
            padding-right: 8px;
            margin: 10px;
            background-color: #FFB9B9;
        }

        .font {
            font-size: 12px;
            font-weight: 400;
            text-align: center;
            color: white;
        }

        .font1 {
            width: 123px;
            height: 19px;
            margin-top: 8px;
            font-size: 16px;
            font-weight: 400;
            color: #000;
            text-align: left;
        }

        .font2 {
            width: 113px;
            height: 17px;
            font-size: 14px;
            font-weight: 400;
            color: #8B8B8B;
            margin-top: 10px;
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="box"></div>
        <div class="box1">
            <div class="font">반가워요!</div>
            <div class="font1">좋은하루보내세요!</div>
            <div class="font2">날씨가 좋네요!</div>
        </div>
    </div>


</body>

</html>

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <style>
        * {
            box-sizing: border-box;
        }

        .wrap {
            width: 220px;
            height: 260px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .container {
            width: 160px;
            height: 160px;
            top: 16px;
            left: 16px;
            border-radius: 50%;
            background: #ca785c;
        }

        .f {
            font-family: Inter;
            font-weight: 700;
            font-style: Bold;
            font-size: 16px;
            line-height: 100%;
            letter-spacing: 0%;

            text-align: center;
        }
    </style>

    <div class="wrap">
        <div class="container"></div>
        <div class="f">
            <p>프로필</p>
        </div>
    </div>
</body>

</html>

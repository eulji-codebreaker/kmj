<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>
        .container {
            border: 2px, solid black;
            margin: 10px;
            padding: 10px;
        }
        
        p {
            background: lightblue;
            border: 1px solid blue;
            padding: 10px;
            margin: 10px;
        }
    </style>
</head>

<body>
<div class="container">
    <p id="change1">삭제할 항목 1</p>
    <p id="change2">삭제할 항목 2</p>
    <p id="change3">삭제할 항목 3</p>
    <p id="change4">삭제할 항목 4</p>
</div>


    <button onclick="del();">첫 번째 삭제</button>
    <button onclick="del1();">두 번째 삭제</button>
    <button onclick="del2();">세 번째 삭제</button>
    <button onclick="del3();">마지막 삭제</button>

    <script>
        function del() {
            var element = document.getElementById('change1');
            element.remove();
        }

        function del1() {
            const element1 = document.getElementById('change2');
            element1.remove();
        }

        function del2() {
            const element2 = document.getElementById('change3');
            element2.remove();
        }

        function del3() {
            const element2 = document.getElementById('change4');
            element2.remove();
        }
    </script>


</body>

</html>

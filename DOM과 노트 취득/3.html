<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .box {
            border-radius: 5px;
            border: 2px solid lightgray;
            padding: 10px;
            margin: 5px 5px 10px;
            max-width: 500px;
        }
        .box-highlight{
            border-radius: 5px;
            border: 2px solid #ffd901;
            background-color: #ffffcc;
            padding: 10px;
            margin: 5px 5px 10px;
            max-width: 500px;
        }

        .item {
            border: 1px solid lightgray;
            border-left: 3px solid #007bff;
            background-color: lightgray;
            margin: 5px;
            padding: 10px;
            max-width: 500px;
        }

        p  {
            background-color: #ffffcc;
            max-width: 500px;
        }

        button {
            background-color: #007bff;
            color: white;
            display: flex;
            justify-content: center;
            text-align: center;
            margin: 10px;
            padding: 10px 20px;
            border-radius: 3px;
            border: 0;
            cursor: pointer;
        }

        button:hover {
            background-color: #0056b3;
        }
    </style>
</head>

<body>

    <div class="box">첫 번째 박스</div>
    <div class="box">두 번째 박스</div>
    <div class="box-highlight">세 번째 박스 (하이라이트)</div>


    <div class="item">첫 번째 아이템</div>
    <div class="item">두 번째 아이템</div>
    <div class="item">세 번째 아이템</div>

    <p>하이라이트된 문단입니다</p>


    <button onclick="selectb();">모든 박스 선택</button>
    <button onclick="selecti();">모든 아이템 선택</button>
    <button onclick="highlight();">하이라이트 요소들 선택</button>

    <script>
        function selectb() {
            var selectb = document.getElementsByClassName('.box');
            for(i = 0; selectb.length > 0; i++){
                selectb.innerHTML = "선택된 박스 " + (i += 1);
                selectb.style.backgroundColor = "#ccffcc";
            }
        }

        function selectl() {
            var selectl = document.querySelectorAll("li");
            selectl.forEach((li, idx) => {
                li.innerText = "새로운 목록 항목 " + (idx + 1);
                li.style.color = "#007bff";
                li.style.fontWeight = "bold";
            })
        }

        function firstm() {
            var firstm = document.getElementsByTagName("p");
            if (firstm.length > 0) {
                firstm[0].innerHTML = "첫 번째 문단만 선택되었습니다!";
                firstm[0].style.backgroundColor = "#ccffcc";
            }
            else {
                firstm.style.backgroundColor = "#000000";
            }
        } 
    </script>


</body>

</html>
